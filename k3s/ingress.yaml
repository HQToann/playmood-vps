apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playmood-ingress
  namespace: playmood
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          # 1. Luồng WebSocket định tuyến vào Pod realtime
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: playmood-realtime    # <-- ĐỔI THÀNH playmood-realtime
                port:
                  number: 80
          # 2. Toàn bộ Web UI, Django Admin và REST API chuyển vào Pod web
          - path: /
            pathType: Prefix
            backend:
              service:
                name: playmood-web
                port:
                  number: 80