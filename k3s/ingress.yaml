apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playmood
  namespace: playmood
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: playmood-notification
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: playmood-web
                port:
                  number: 80
