apiVersion: apps/v1
kind: Deployment
metadata:
  name: playmood-web
  namespace: playmood
  labels:
    app: playmood-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: playmood-web
  template:
    metadata:
      labels:
        app: playmood-web
    spec:
      containers:
        - name: web
          image: playmood-web:latest
          # Dùng IfNotPresent để K3s ưu tiên nạp image đã build/import trên VM1, tránh lỗi ImagePullBackOff
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: playmood-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Liveness: Kiểm tra tiến trình web còn sống (không query DB để tránh quá tải)
          livenessProbe:
            httpGet:
              path: /health/?type=liveness
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness: Kiểm tra kết nối thông suốt tới Postgres & Redis trên VM3 trước khi cho nhận request
          readinessProbe:
            httpGet:
              path: /health/?type=readiness
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2