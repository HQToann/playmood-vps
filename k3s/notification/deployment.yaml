apiVersion: apps/v1
kind: Deployment
metadata:
  name: playmood-notification
  namespace: playmood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playmood-notification
  template:
    metadata:
      labels:
        app: playmood-notification
    spec:
      containers:
        - name: notification
          image: traefik/whoami:latest
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: playmood-env
          readinessProbe:
            httpGet:
              path: /health
              port: 80
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 256Mi }
